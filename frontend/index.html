<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 기반 업무 말투 변환기 - 비즈니스 이메일, 슬랙 메시지 등을 상황에 맞게 자동으로 변환해 줍니다.">
    <title>업무 말투 변환기 — AI Business Tone Converter</title>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- 헤더 섹션 -->
        <header class="app-header">
            <div class="logo">💼 BizTalk</div>
            <h1>업무 말투 변환기</h1>
            <p>AI가 당신의 메시지를 상사, 동료, 고객의 눈높이에 맞춰 정중하고 명확하게 다듬어 줍니다.</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="app-main">
            <div class="workspace-grid">
                <!-- 좌측: 입력 카드 -->
                <section class="card input-card">
                    <div class="card-header">
                        <h2>원문 입력</h2>
                        <span class="badge">Original</span>
                    </div>
                    <div class="card-body">
                        <textarea id="inputText" maxlength="500" placeholder="상황을 설명하거나 변환하고 싶은 메시지를 자유롭게 입력해 주세요. (예: 내일까지 보고서 제출 어려울 것 같음)"></textarea>
                        <div class="textarea-footer">
                            <span id="charCounter" class="counter">0 / 500 자</span>
                            <button id="btnClear" class="text-btn">비우기</button>
                        </div>
                    </div>
                </section>

                <!-- 우측: 결과 카드 -->
                <section class="card output-card">
                    <div class="card-header">
                        <h2>변환 결과</h2>
                        <span class="badge accent">Converted</span>
                    </div>
                    <div class="card-body">
                        <textarea id="outputText" readonly placeholder="수신 대상을 선택한 뒤 아래 '말투 변환하기' 버튼을 클릭하면 결과가 여기에 표시됩니다."></textarea>
                        <div class="textarea-footer">
                            <button id="btnCopy" class="secondary-btn" disabled>
                                <span class="btn-icon">📋</span> 복사하기
                            </button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 하단: 옵션 및 실행 버튼 -->
            <section class="options-section">
                <div class="section-title">
                    <h3>수신 대상 선택</h3>
                    <p>메시지를 읽을 상대방을 선택해 주세요. 대상에 맞춰 프롬프트가 동적으로 변경됩니다.</p>
                </div>

                <!-- 수신 대상 선택 그리드 -->
                <div class="audience-grid">
                    <button class="audience-btn active" data-target="boss">
                        <span class="audience-icon">👨‍💼</span>
                        <div class="audience-info">
                            <span class="audience-title">상사 / 임원</span>
                            <span class="audience-desc">격식 있고 정중하며 공손한 말투</span>
                        </div>
                    </button>
                    <button class="audience-btn" data-target="colleague">
                        <span class="audience-icon">🤝</span>
                        <div class="audience-info">
                            <span class="audience-title">타팀 동료</span>
                            <span class="audience-desc">정중하고 협조적인 업무 말투</span>
                        </div>
                    </button>
                    <button class="audience-btn" data-target="client">
                        <span class="audience-icon">👑</span>
                        <div class="audience-info">
                            <span class="audience-title">고객 / 외부</span>
                            <span class="audience-desc">친절하고 신뢰감 있는 서비스 말투</span>
                        </div>
                    </button>
                    <button class="audience-btn" data-target="team">
                        <span class="audience-icon">👥</span>
                        <div class="audience-info">
                            <span class="audience-title">팀 내 동료</span>
                            <span class="audience-desc">간결하고 실무적인 효율적 말투</span>
                        </div>
                    </button>
                </div>

                <!-- 말투 변환 실행 버튼 -->
                <div class="action-container">
                    <button id="btnConvert" class="primary-btn">
                        <span class="btn-icon">✨</span> 말투 변환하기
                    </button>
                </div>
            </section>
        </main>

        <!-- 푸터 -->
        <footer class="app-footer">
            <p>&copy; 2026 BizTalk. Powered by Upstage Solar-Pro3 & FastAPI.</p>
        </footer>
    </div>

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner-container">
            <div class="spinner"></div>
            <p class="loading-text">AI가 메시지를 분석하여 변환하고 있습니다...</p>
        </div>
    </div>

    <!-- 토스트 알림 메시지 -->
    <div id="toast" class="toast-message hidden">
        <span class="toast-icon">✅</span>
        <span id="toastText">텍스트가 클립보드에 복사되었습니다!</span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
